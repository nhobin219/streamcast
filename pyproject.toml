[project]
name = "streamcast"
version = "0.26.0"
description = "A JSON WebSocket pubsub framework for structured data. Every message lands in an Iceberg table: no ETL, no second copy."
readme = "README.md"
authors = [
    { name = "Nico Bautista Hobin", email = "nico@penca.io" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# litelink's floor, and for the same reason: 3.10 reaches end of life in
# October 2026 and nothing here needs it. The ceiling is litelink's too —
# <3.15 since its 0.8.1 — and a library whose whole durable tier is that one
# cannot claim a wider range than it.
requires-python = ">=3.11,<3.15"
keywords = ["websocket", "multicast", "broadcast", "tickerplant", "market-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    # The transport, and the interface this library is shaped after. 14 is the
    # floor because `websockets.asyncio` is what everything here imports: the
    # legacy `websockets.server`/`websockets.client` implementation is
    # deprecated, and the two have different connection objects, so a build
    # that resolved 12 would import successfully and fail at `serve`. The cap
    # is because `recv_many` reads a private queue (`_client._arrived`):
    # raise it once `tests/test_batches.py` passes against the next major.
    "websockets>=14,<18",
    # The durable tier. NOT optional, and that was a real decision: a
    # live-only broker needs nothing from it, and litelink pulls in duckdb,
    # pyarrow and pyiceberg, which is ~124 MB of wheel for a library whose own
    # code is a few thousand lines.
    #
    # It is required anyway, because the alternative is an install where
    # `offset=` does not work. Replay is not a feature of streamcast — it is
    # the reason it exists rather than being a fifty-line broadcast loop, and
    # an extra that gates it would put the difference between a multicaster
    # and a tickerplant behind a dependency marker nobody reads until the
    # first consumer restart.
    #
    # 0.5.0 for `column_statistics`, which the manifest is built from, and
    # for finite-only floats, which is what makes a float column prunable;
    # 0.5.1 for seals sized by what the Arrow table actually weighs (#84);
    # 0.8.1 for Python 3.14; 0.9.0 for `current_metadata`, a published
    # table's current metadata read outside DuckDB's caches (litelink#141);
    # 0.10.0 for `restore` without a WAL replica, and its reserve keywords;
    # 0.10.1 for `restore`'s schema, sort_by and config; 0.10.2 for a
    # `retire` that does not walk every manifest, which `Stream.retire` runs,
    # and a publish that re-applies the table's metadata properties; 0.11.0
    # for `staging_max_bytes`, flushed publishes that are swapped for full
    # files later, and compaction sized on disk; 0.12.0 for small objects
    # uploaded in one request, which needs pyarrow 21 — the floor this
    # library's own S3 writes rely on too (`_remote._filesystem`); 0.12.2
    # for `truncate` (0.12.1) and seals under `data/sealed/`; 0.12.3 for
    # truncating and deleting a retired log from its published table, which
    # retention needs, and metadata read from object storage once; 0.12.4
    # for a failed claim commit that raises its real error and orphans no
    # claim, which a maintainer's stop signal relied on. 0.12.5's public
    # `replication` and `column_ddl` are not used here, so 0.13.0 making them
    # private again breaks nothing; 0.13.1 for a table's metadata JSON
    # fsynced before the catalog names it, so a power loss cannot leave a
    # log that will not open (litelink#198); 0.14.0 for the buffer's write
    # transaction (`log.transaction()`, `extend(tx=)`), which commits each
    # exactly-once publisher's mark with its rows (litelink#205).
    #
    # Capped below the next minor: under 0.x a minor is litelink's breaking
    # release, and a published streamcast must not resolve one it was never
    # tested against. Each release moves the cap deliberately.
    "litelink>=0.14.0,<0.15",
    # Serialisation is on the hot path in BOTH directions — every publish
    # encodes a row, every replayed row re-encodes one — which is what earns
    # a compiled dependency here. Measured against stdlib `json` on a
    # six-column trade row: 0.285 us against 5.815 to encode (20.4x) and
    # 0.386 against 4.989 to decode (12.9x). At stdlib speed the encode would
    # cost more than the Parquet read it rides on.
    "msgspec>=0.18",
    # The broker is one FastAPI application (`create_app`), for static
    # streams and managed ones alike, so FastAPI is not optional: there is no
    # broker without it. 0.141.1 is the release the application was built and
    # tested against.
    "fastapi>=0.141.1",
    # StreamSpec validates both field names and aliases and serializes aliases;
    # those ConfigDict settings require 2.11, above FastAPI's own floor.
    "pydantic>=2.11",
    # The ASGI server the broker is supported under, with one worker and its
    # lifespan on (`docs/API.md`). A dependency rather than the deployer's
    # choice because nothing else in the library binds a socket: without it
    # `pip install streamcast` could not run a broker at all. The floor is the
    # release the suite runs against; an older one is untested, not refused.
    "uvicorn>=0.54",
]

[project.optional-dependencies]
# The Postgres adapter for a CALLER's database (`PostgresStore`), where an
# outbox and an inbox commit with the caller's own state. psycopg 3, for its
# native asyncio connection; the adapter's tests pass at the 3.1 floor and on
# the latest. SQLite needs nothing: it is the stdlib's.
postgres = ["psycopg>=3.1"]

[project.urls]
Source = "https://github.com/nhobin219/streamcast"
Specification = "https://github.com/nhobin219/streamcast/blob/main/docs/SPEC.md"

[build-system]
# uv_build rather than litelink's hatchling: the build hook there exists to
# stamp a platform tag and put a native binary in the wheel, and streamcast
# ships no binaries. A pure wheel needs no hook.
requires = ["uv_build>=0.9.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "streamcast"


[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0",
    # A hung test must fail, not hang. Every test here drives a real socket
    # and a real event loop, and the failure mode of a broadcast bug is
    # usually a coroutine waiting for a message that will never arrive — which
    # without this is a CI job that burns its whole limit and reports nothing.
    "pytest-timeout>=2.3",
    # A TEST dependency, not a library one. The replication tier ships a WAL
    # to object storage through litestream, and these fixtures assert against
    # the bucket directly — which is a different job from anything streamcast
    # itself does, and streamcast reaches S3 through nothing at all.
    #
    # Its absence would skip the whole tier silently, which is how a tier goes
    # unchecked; `STREAMCAST_REQUIRE_S3` turns that skip into a failure.
    "s3fs>=2024.6.0",
    # A TEST dependency. `_schema` claims that `required` is about presence
    # while `"null"` in a type is about the value — which is a claim about
    # someone else's specification, and the kind this repo has been wrong
    # about before. `test_schema.py` asserts the mapping against a real
    # validator rather than against my reading of the spec.
    "jsonschema>=4.20",
    # A TEST dependency, with its bundled libpq, for the Postgres adapter's
    # contract tests against a throwaway cluster on loopback.
    "psycopg[binary]>=3.1",
    "ruff>=0.15.0",
    # A TEST dependency: Starlette's TestClient does not reach a real socket,
    # and the claims `tests/test_asgi.py` makes — a refusal's reason
    # surviving, a close landing 1000 not 1006, `max_backlog` still dropping a
    # slow consumer — are about what reaches the peer, so the suite runs the
    # app under uvicorn and talks to it over httpx and websockets.
    "httpx>=0.28.1",
    "ty>=0.0.15",
    # FOR AN EXAMPLE ONLY: `examples/otel/` runs OpenTelemetry logs and
    # traces through two streams and re-exports them as OTLP, and
    # `tests/test_otel_example.py` runs it. Nothing in `streamcast` imports
    # OTel — the schemas and conversions live in the example, built from
    # streamcast's ordinary column types.
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-instrumentation-logging>=0.66b0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# force-exclude keeps exclusions in force when paths are passed explicitly —
# pre-commit and `ruff format <path>` both do that.
force-exclude = true
# ruff's default `include` minus `*.md`: docs/SPEC.md's snippets are aligned
# by hand to read as prose, and the formatter rewrites every one of them.
include = [
    "*.py",
    "*.pyi",
    "*.pyw",
    "*.ipynb",
    "**/pyproject.toml",
    "**/ruff.toml",
    "**/.ruff.toml",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Must be the ini form rather than `addopts`: on pytest 9 the flag only appends
# to `override_ini`, and `Config.parse` builds `_inicfg` from the command line
# before injecting `addopts` and never recomputes it — so a typo'd mark
# degrades to a warning instead of failing collection.
strict_markers = true
# Every test here drives an event loop. Declaring the mode rather than marking
# ~80 coroutines individually, and `strict` so a sync test is never silently
# treated as async.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Generous against a slow machine and still far under a wedged coroutine.
# Per-test, so a suite that hangs names the test that hung.
timeout = 60
markers = [
    "replication: ships a WAL to object storage through litestream — `just rustfs` starts an endpoint, or set AWS_ENDPOINT_URL. Skipped when none answers, unless STREAMCAST_REQUIRE_S3 is set.",
    "interop: runs this build against released streamcast versions from PyPI, each in a virtualenv of its own. Skipped when uv cannot install them from its cache, unless STREAMCAST_REQUIRE_INTEROP is set, which lets it fetch them and fails if it cannot.",
    "slow: drives real fsync volume or a real backlog overflow — wall-clock bound rather than CPU bound. Deselect with -m 'not slow'.",
]
