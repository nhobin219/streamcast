name: Chart

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Helm lint and template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Test the PR head, rather than GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      - run: helm lint charts/streamcast --strict
      - run: helm template smoke charts/streamcast
      - run: uv run pytest tests/test_chart.py tests/test_supervise.py -q -k 'not oom_one_role and not external_scale_installs and not external_scale_survives' --durations=5

  kind:
    name: Kind scale ownership and role OOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      # The image is built locally; the test never needs registry credentials.
      - run: docker build -f docker/Dockerfile -t streamcast:chart-ci .
      - name: Configure single-process OOM killing
        run: |
          cat > kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          kubeadmConfigPatches:
            - |
              kind: KubeletConfiguration
              singleProcessOOMKill: true
          EOF
      - uses: helm/kind-action@v1.12.0
        with:
          # containerd 2 in this node image requires the newer image loader.
          version: v0.27.0
          cluster_name: chart-ci
          node_image: kindest/node:v1.32.2
          config: kind-config.yaml
      - run: kind load docker-image streamcast:chart-ci --name chart-ci
      - run: >-
          uv run pytest
          tests/test_chart.py::test_oom_one_role_restarts_in_place_and_pod_ready_holds
          tests/test_chart.py::test_external_scale_survives_helm_upgrade
          tests/test_chart.py::test_external_scale_installs_and_upgrades_without_claim
          -q --durations=5
        env:
          STREAMCAST_CHART_KIND: "1"
          STREAMCAST_CHART_IMAGE: streamcast:chart-ci
      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.metadata.creationTimestamp

  chart-success:
    name: Chart success
    if: always()
    needs: [render, kind]
    runs-on: ubuntu-24.04
    steps:
      - if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: exit 1
