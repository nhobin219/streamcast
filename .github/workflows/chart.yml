name: Chart

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Helm lint and template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Test the PR head, rather than GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      - run: helm lint charts/streamcast --strict
      - run: helm template smoke charts/streamcast
      - run: uv run pytest tests/test_chart.py -q -k 'not oom' --durations=5

  kind:
    name: Kind install and role OOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      # The image is built locally; the test never needs registry credentials.
      - run: docker build -f docker/Dockerfile -t streamcast:chart-ci .
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: chart-ci
          node_image: kindest/node:v1.32.2
      - run: kind load docker-image streamcast:chart-ci --name chart-ci
      - run: uv run pytest tests/test_chart.py::test_oom_one_role_restarts_only_that_container -q --durations=5
        env:
          STREAMCAST_CHART_KIND: "1"
          STREAMCAST_CHART_IMAGE: streamcast:chart-ci
      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.metadata.creationTimestamp

  chart-success:
    name: Chart success
    if: always()
    needs: [render, kind]
    runs-on: ubuntu-24.04
    steps:
      - if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: exit 1
