name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  # Fold the commit in for pushes, so every main push gets its own group and
  # can never displace another. github.sha is empty on pull_request, so PRs
  # keep superseding themselves; merge_group is unaffected.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  # Only a pull_request supersedes itself. Cancelling a merge_group entry can
  # eject the PR from the queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: python scripts/check_blank_lines.py

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ty check

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # An S3-compatible endpoint, because without one the replication tier
    # SKIPS — and a skip is not a pass. That tier is where litestream is
    # actually run and where "never two instances on one database" is
    # checked, so leaving it unrun would be the safety property going
    # unverified in the one place that verifies it.
    #
    # Same image as `just rustfs`, so CI and a developer machine are one
    # environment rather than two that drift. Pinned, not `:latest`: a
    # floating tag that renamed its credential env vars would still answer on
    # the port, the bucket call would fail, and the tier would vanish green.
    services:
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.4
        env:
          RUSTFS_ACCESS_KEY: streamcast
          RUSTFS_SECRET_KEY: streamcast-secret
        ports:
          - 9002:9000

    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current top of the supported range. The
        # floor is what .python-version pins locally, so a 3.13-only regression
        # is the one CI catches that a dev machine does not.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # Any HTTP answer means it is listening. NOT `curl -f`: an
      # unauthenticated S3 root answers 403, which is a healthy server
      # refusing an anonymous request, and -f reads that as a failure.
      - name: Wait for the S3 endpoint
        run: |
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:9002 2>/dev/null; then
              echo "rustfs is listening"; exit 0
            fi
            sleep 1
          done
          echo "rustfs never came up; the replication tier would not run" >&2
          exit 1

      # Not `-m "not slow"`. The slow tier here is the backpressure suite —
      # the only place a real queue overflow is forced against a real socket —
      # and it is where the isolation guarantee either holds or does not.
      # Skipping it in CI would leave that claim checked nowhere.
      #
      # STREAMCAST_REQUIRE_S3 turns a skipped replication tier into a
      # failure. Without it, a dead endpoint would look exactly like an
      # absent one and eight tests would vanish green.
      - run: uv run pytest -q
        env:
          STREAMCAST_REQUIRE_S3: "1"

  packaging:
    name: The wheel imports and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build --wheel --out-dir dist

      # Installed into a clean environment and driven end to end, because
      # every packaging defect this could have looks identical from a source
      # checkout: a module left out of the wheel, a dependency declared in the
      # dev group by accident, a `py.typed` that did not ship.
      - name: Install it and run a stream through it
        run: |
          uv venv --python 3.11 cold
          uv pip install --python cold/bin/python dist/*.whl
          cd /tmp && "$GITHUB_WORKSPACE/cold/bin/python" - <<'PY'
          import asyncio, tempfile
          from pathlib import Path
          import litelink, pyarrow as pa, streamcast

          assert (Path(streamcast.__file__).parent / "py.typed").exists()

          # The CALLER's schema, which is the point: streamcast declares none.
          SCHEMA = pa.schema([
              pa.field("event_ts", pa.int64(), nullable=False),
              pa.field("price", pa.float64()),
              pa.field("side", pa.int64()),
          ])

          def row(i):
              return {"event_ts": 1_790_038_800_000_000 + i,
                      "price": 85_565.0 + i, "side": i % 2}

          async def main():
              root = Path(tempfile.mkdtemp())
              with litelink.new(root, "trades", schema=SCHEMA,
                                sort_by=("event_ts",)) as log:
                  stream = streamcast.Stream("trades", log=log)
                  server = await streamcast.serve(stream, "127.0.0.1", 0)
                  port = server.sockets[0].getsockname()[1]
                  uri = f"ws://127.0.0.1:{port}/trades"

                  await stream.send_many([row(i) for i in range(50)])
                  async with streamcast.connect(uri, offset=streamcast.EARLIEST) as sub:
                      got = [await sub.recv() for _ in range(50)]

                  assert [offset for offset, _ in got] == list(range(1, 51)), got[:3]
                  assert got[7][1]["price"] == 85_572.0, got[7]
                  # And the log is a TABLE, which is the whole reason litelink
                  # is underneath this rather than an append-only file. A wheel
                  # that shipped a working server over an unqueryable log would
                  # pass every other check in this job.
                  n, high = log.sql(
                      "SELECT count(*) n, max(price) high FROM log"
                  ).read_all().to_pylist()[0].values()
                  assert (n, high) == (50, 85_614.0), (n, high)
                  server.close()
                  await server.wait_closed()

          asyncio.run(main())
          print("cold box: 50 rows replayed out of a queryable log via an installed wheel")
          PY

  ci-success:
    name: CI success
    if: always()
    needs: [lint, typecheck, test, packaging]
    runs-on: ubuntu-latest
    steps:
      # One required check for branch protection / the merge queue.
      #
      # **Every job must be listed in `needs` above.** `needs.*` expands only
      # to the jobs named, so a job added later and not listed here can fail
      # red on a PR while this reports success.
      #
      # `skipped` counts as a failure too. A needed job that never ran is not
      # a job that passed.
      - if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: exit 1
