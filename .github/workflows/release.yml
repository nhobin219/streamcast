name: Release

# Cutting a tag is the whole trigger. CI already runs on `v*` pushes too, so the
# suite and this workflow start together — but publishing is gated on the checks
# below rather than on that run, because a job that publishes must not depend on
# a green light it cannot see.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # The tag and the version in pyproject.toml are two statements of the same
      # fact, and PyPI will not let the second one be corrected later: a release
      # is immutable, so a `v0.2.0` tag that ships 0.1.0 burns the version
      # number. Fail before anything is built.
      - name: Tag matches the packaged version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(uv version --short)
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME declares $tagged, pyproject.toml says $packaged" >&2
            exit 1
          fi
          echo "both say $packaged"

      # A pushed tag cannot be corrected without re-running this workflow, so
      # its message is checked here too: annotated, reading "streamcast X.Y.Z"
      # like every tag since 0.19.0. Asked of the API, because checkout does
      # not keep the annotated tag object (actions/checkout#290).
      - name: Tag is annotated "streamcast <version>"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="streamcast ${GITHUB_REF_NAME#v}"
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object)
          if [ "$(jq -r .type <<<"$object")" != tag ]; then
            echo "$GITHUB_REF_NAME is a lightweight tag; cut it with" >&2
            echo "  git tag -a $GITHUB_REF_NAME -m \"$want\" <sha>" >&2
            exit 1
          fi
          got=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .sha <<<"$object")" --jq .message | head -1)
          if [ "$got" != "$want" ]; then
            echo "tag message reads \"$got\", expected \"$want\"; cut it with" >&2
            echo "  git tag -a $GITHUB_REF_NAME -m \"$want\" <sha>" >&2
            exit 1
          fi
          echo "tag reads \"$want\""

      # **A path source must never reach PyPI.** While litelink and streamcast
      # change together, `[tool.uv.sources]` points at a checkout next door.
      # `uv` leaves it out of the built metadata, so a wheel would install and
      # resolve the version floor correctly — but a release cut from a tree
      # still carrying it was built against a litelink that is not the one the
      # floor names, and nothing downstream could tell. Fail loudly instead.
      - name: No path dependencies in the released tree
        run: |
          if grep -q "^\[tool.uv.sources\]" pyproject.toml; then
            echo "pyproject.toml still has [tool.uv.sources] — a release must" >&2
            echo "resolve its dependencies from the index, not from a sibling" >&2
            echo "checkout. Drop it and pin the floor." >&2
            exit 1
          fi
          echo "dependencies resolve from the index"

      # Pure Python, one wheel. There is no build hook and nothing vendored —
      # litelink carries binaries and needs a wheel per platform; this does not.
      - name: Build
        run: |
          uv build
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    name: Install the wheel and run a stream through it
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Against the built WHEEL in a clean environment, not the source tree.
      # Every packaging defect this could have looks identical from a checkout:
      # a module left out of the wheel, a dependency declared in the dev group
      # by accident, a `py.typed` that did not ship, or a litelink floor that
      # resolves to a release without the API this needs.
      - name: Serve and replay on a cold box
        run: |
          uv venv --python 3.11 cold
          uv pip install --python cold/bin/python dist/*.whl
          cd /tmp && "$GITHUB_WORKSPACE/cold/bin/python" - <<'PY'
          import asyncio, tempfile
          from pathlib import Path
          import streamcast, uvicorn

          assert (Path(streamcast.__file__).parent / "py.typed").exists()

          SCHEMA = {
              "type": "object",
              "properties": {
                  "event_ts": {"type": "integer"},
                  "price": {"type": "number"},
              },
              "required": ["event_ts", "price"],
          }

          async def main():
              root = Path(tempfile.mkdtemp())
              stream = streamcast.StreamHandle.open(
                  streamcast.Stream(
                      spec=streamcast.StreamSpec(name="trades", schema=SCHEMA,
                                                 sort_by=("event_ts",)),
                      storage=streamcast.Storage(root=root),
                  ), initialization="create_if_absent")
              try:
                  app = streamcast.create_app(streams=stream,
                      config=streamcast.BrokerConfig(maintain=False))
                  lifespan = app.router.lifespan_context(app)
                  await lifespan.__aenter__()
                  server = uvicorn.Server(uvicorn.Config(app, host="127.0.0.1", port=0,
                      lifespan="off", ws_per_message_deflate=False))
                  task = asyncio.create_task(server.serve())
                  async with asyncio.timeout(10):
                      while not server.started:
                          if task.done():
                              await task
                              raise RuntimeError("listener failed")
                          await asyncio.sleep(0.001)
                  port = server.servers[0].sockets[0].getsockname()[1]
                  uri = f"ws://127.0.0.1:{port}/trades"
                  await stream.send_many(
                      [{"event_ts": i, "price": 1.0 * i} for i in range(50)]
                  )

                  async with streamcast.connect(
                      uri, offset=streamcast.EARLIEST
                  ) as sub:
                      got = [await sub.recv() for _ in range(50)]

                  assert [o for o, _, _ in got] == list(range(1, 51)), got[:3]
                  assert all(isinstance(ts, int) for _, ts, _ in got), got[:3]
                  assert got[7][2]["price"] == 7.0, got[7]

                  # The log is a queryable table, which is the reason litelink
                  # is underneath this. A wheel that served rows over a log
                  # nothing could query would pass every other check here.
                  rows = stream.log.sql(
                      "SELECT count(*) n, max(price) high FROM log"
                  ).read_all().to_pylist()[0]
                  assert (rows["n"], rows["high"]) == (50, 49.0), rows

                  await lifespan.__aexit__(None, None, None)
                  server.should_exit = True
                  await task

              finally:
                  await stream.aclose()

          asyncio.run(main())
          print("cold box: 50 rows replayed out of a queryable log via an installed wheel")
          PY

  publish:
    name: Publish to PyPI
    needs: smoke
    runs-on: ubuntu-24.04
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no API token in the repository to leak or rotate. It requires a
    # publisher configured on the PyPI project side — owner, repo, workflow
    # filename, and this environment name must all match what is registered
    # there, or the upload is rejected.
    environment:
      name: pypi
      url: https://pypi.org/p/streamcast
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Full history and tags: the notes are generated from the commits since
      # the previous tag, and the default shallow checkout has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Notes from the commit BODIES, not from pull request titles.
      # `--generate-notes` lists PR titles and throws the bodies away, which in
      # this history is the part worth reading: every commit carries the reason
      # for the change. `scripts/release_notes.py` takes each body's lead
      # paragraph and groups by Conventional Commit type.
      #
      # `--notes-file`, so a failure to generate them fails the step rather
      # than publishing a release with an empty body.
      - name: Generate the notes
        run: |
          previous=$(git tag --sort=-creatordate | grep -v "^$GITHUB_REF_NAME$" | head -1)
          python scripts/release_notes.py \
            ${previous:+--since "$previous"} \
            --version "${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md

      - run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  ghcr-build:
    name: Publish image digest (${{ matrix.arch }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each runner builds its native architecture. The release manifest joins
      # immutable digests, so neither architecture can overwrite the other.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  ghcr-image:
    name: Publish versioned multi-architecture image
    needs: ghcr-build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge release digests
        shell: bash
        run: |
          sources=()
          for digest in digests/*; do
            hash="${digest##*/}"
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$hash")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            --tag "$IMAGE:${GITHUB_REF_NAME#v}" \
            --tag "$IMAGE:$GITHUB_SHA" "${sources[@]}"

  ghcr-latest:
    name: Promote the newest release image
    needs: [ghcr-image, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # Serialize only the movable channel. Cancelling a pending promotion must
    # never cancel publication of a versioned image or chart.
    concurrency:
      group: ghcr-latest
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote latest only for the newest stable tag
        shell: bash
        run: |
          git fetch --force --tags origin
          newest=$(git tag --list 'v*' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -1)
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then
            docker buildx imagetools create \
              --tag "$IMAGE:latest" "$IMAGE:${GITHUB_REF_NAME#v}"
          else
            echo "Skipping latest: $GITHUB_REF_NAME is not the newest stable tag"
          fi

  ghcr-chart:
    name: Publish the OCI chart
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Package the matching release chart
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          metadata=$(helm show chart charts/streamcast)
          test "$(awk '$1 == "version:" {print $2}' <<< "$metadata")" = "$version"
          test "$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' <<< "$metadata")" = "$version"
          helm lint charts/streamcast --strict
          helm package charts/streamcast --destination chart-dist
      - name: Publish the chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GHCR_USER" --password-stdin
          helm push "chart-dist/streamcast-${GITHUB_REF_NAME#v}.tgz" "$CHART_REGISTRY"
