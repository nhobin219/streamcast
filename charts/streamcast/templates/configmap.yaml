{{- include "streamcast.validate" . -}}
{{- if not .Values.broker.command }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streamcast.fullname" . }}-config
  labels:
    {{- include "streamcast.labels" . | nindent 4 }}
data:
  broker.toml: |
    {{- include "streamcast.config" . | nindent 4 }}
{{- end }}
